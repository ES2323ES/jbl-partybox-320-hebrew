<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6FA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PartyBox 320" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>JBL PartyBox 320 — מרכז שליטה</title>
    <meta
      name="description"
      content="אפליקציית שליטה ייעודית בעברית לרמקול הנייד JBL PartyBox Stage 320 עם שליטה מלאה בתאורת מופע רב-אזורית, איקוולייזר 7 ערוצים בזמן אמת, חיבור Bluetooth ואפקטי מסיבה."
    />
    <meta property="og:title" content="JBL PartyBox 320 — מרכז שליטה" />
    <meta
      property="og:description"
      content="אפליקציית שליטה ייעודית בעברית לרמקול הנייד JBL PartyBox Stage 320 עם שליטה מלאה בתאורת מופע רב-אזורית, איקוולייזר 7 ערוצים בזמן אמת, חיבור Bluetooth ואפקטי מסיבה."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Rubik:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var savedTheme = localStorage.getItem('jbl_pb320_theme_v2');
        if (savedTheme === 'neon') {
          document.documentElement.classList.add('dark', 'theme-neon');
        } else if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('theme-neon');
        } else {
          document.documentElement.classList.remove('dark', 'theme-neon');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#F4F6FA] text-slate-800 dark:bg-[#161D2B] dark:text-slate-100 antialiased selection:bg-[#D95B2B]/20 selection:text-[#D95B2B] transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
